emotion_recognition_node:
  ros__parameters:
    camera_device: /dev/video0
    emotion_model: fer
    show_camera: true
    width: 640
    height: 480
    confidence_threshold: 0.65
    stable_frames: 4
    cooldown: 1.0
    no_face_timeout: 0.7
    camera_timeout: 0.7
    detection_interval: 0.15
    # Reject all multiple-face scenes; never switch primary face during motion.
    face_selection_policy: reject_multiple
emotion_behavior_node:
  ros__parameters:
    cmd_topic: /cmd_vel
    confidence_threshold: 0.65
    signal_timeout: 0.7
    sensor_timeout: 1.0
    speed: 0.06                 # m/s
    angular_speed: 0.25         # rad/s, rotation only
    distance: 0.10              # m, linear moves
    radius: 0.50                # m, curves: omega = speed/radius
    curve_distance: 0.25        # m, path length
    rotation_target: 6.283185307179586
    segment_timeout: 40.0       # wall seconds; also protects paused simulation
    clearance: 0.40             # m + entire motion extent, all 360° scan rays
    distance_tolerance: 0.005
    angle_tolerance: 0.025
    stop_tolerance: 0.01       # absolute odometry velocity, m/s and rad/s
    settling_duration: 0.3      # continuous stationary interval, seconds
    settling_timeout: 3.0
