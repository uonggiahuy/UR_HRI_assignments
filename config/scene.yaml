# Canonical M2.5 workcell description. All values use SI units.
# Poses are expressed in the Gazebo `world` frame as named XYZ/RPY fields.
# Pose Z is the geometric center of each box, not a support-surface height.
# Dynamic cube poses are initial spawn poses 1 mm above the tabletop; physics
# settles them onto the table at z = 0.3225 m.
schema_version: 2

robot:
  ur_type: ur3e
  world_frame: world
  # The UR base_link mounting plane is coincident with the pedestal top.
  mount_pose:
    x: 0.0
    y: 0.0
    z: 0.30
    roll: 0.0
    pitch: 0.0
    yaw: 0.0

